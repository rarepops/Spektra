name: release

# Builds and publishes a release when a version tag (vX.Y.Z) is pushed to main.
# Manual runs (workflow_dispatch) build the artifacts for inspection but do not
# create a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (manual test builds only)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write
  # npm trusted publishing: npm exchanges this job's OIDC token for a
  # short-lived registry credential and attaches provenance itself. No
  # publish token is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      # The smoke job installs exactly what this job published.
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tag objects so the release step can read the
          # annotated tag's message body for the optional summary.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Pinned, unlike the first-party actions above, because this one's npm
      # is what authenticates and publishes. Node 24 for an npm new enough to
      # publish through OIDC (11.5.1 or newer; publish.mjs checks and says so
      # if this is ever downgraded).
      #
      # No `cache:` on purpose. This job publishes packages rather than
      # building a JavaScript project: there is no lockfile to key a cache on,
      # and a restored ~/.npm has no business influencing bytes that get
      # published under a permanent version number.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The npm bundled with a Node release is whatever was current when that
      # Node was cut, and it can predate 11.5.1: the usual cause of a 404 or
      # ENEEDAUTH from an otherwise correct trusted-publishing setup, because
      # an older npm never attempts the OIDC exchange and falls through to
      # looking for a token that is deliberately not there. publish.mjs checks
      # the version too and says so, but a release should not get that far.
      #
      # The pair is printed because it is the first thing worth knowing when a
      # publish is refused: npm also warns rather than fails when its Node is
      # too old for it, so an unsupported combination is easy to miss.
      # Pinned, not @latest. @latest made the tool that publishes a moving
      # target: 0.24.2 failed here because npm 12 changed `npm pack --json`
      # from an array to an object keyed by package name, which no local dry
      # run could have caught while this machine was on npm 11. publish.mjs
      # reads both shapes now, but the version that does the publishing should
      # still be one that was tested, and upgrading it should be a commit.
      # Nothing bumps this automatically, so raise it deliberately.
      - name: Use an npm that can publish through OIDC
        shell: bash
        run: |
          npm install -g npm@12.0.2
          node --version
          npm --version

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $ver = '${{ inputs.version }}' }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      # Before anything is built, let alone published: a bare X.Y.Z, matching
      # Directory.Build.props, on main. See tools/validate-release.ps1 for why
      # each one matters. Manual builds skip this; they are stamped 0.0.0-dev
      # and never publish.
      - name: Validate release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/validate-release.ps1 -Version '${{ steps.v.outputs.version }}' -Sha $env:GITHUB_SHA

      - name: Publish GUI (win-x64)
        run: >
          dotnet publish src/Spektra.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o dist/gui-win-x64

      - name: Publish CLI (win/linux/osx)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64','linux-x64','osx-x64','osx-arm64') {
            # IncludeNativeLibrariesForSelfExtract matters: without it the
            # SQLite native library lands BESIDE the exe, and the archive step
            # below copies only spektra*, so it was left out of every release.
            # The CLI then degraded to "cache unavailable" and re-analyzed
            # whole libraries from scratch on every run, announced by one line
            # on stderr. The GUI publish has always had this flag.
            dotnet publish src/Spektra.Cli -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=${{ steps.v.outputs.version }} -o "dist/cli-$rid"
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }
          }

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          New-Item -ItemType Directory -Force dist/artifacts | Out-Null
          # -pdbtype none: without it wix leaves Spektra-<ver>-Setup.wixpdb beside the
          # MSI, and the checksum step below hashed it into SHA256SUMS.txt for a file
          # no release ever carried (every list from 0.21.0 to 0.24.0 has that line).
          wix build packaging/spektra.wxs -arch x64 -pdbtype none `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -o "dist/artifacts/Spektra-${{ steps.v.outputs.version }}-Setup.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - name: Package archives
        shell: pwsh
        run: |
          $ver = '${{ steps.v.outputs.version }}'
          $art = 'dist/artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null

          $g = 'dist/stage-gui'
          New-Item -ItemType Directory -Force $g | Out-Null
          Copy-Item dist/gui-win-x64/spektra.exe $g
          Copy-Item LICENSE.md, README.md $g
          Compress-Archive -Path "$g/*" -DestinationPath "$art/Spektra-$ver-win-x64.zip" -Force

          # The installer is published bare, for double-click installs, and
          # zipped as well, for browsers and mail filters that refuse a bare
          # .msi download. Same file inside, so the extracted MSI still
          # matches its own line in SHA256SUMS.txt.
          Compress-Archive -Path "$art/Spektra-$ver-Setup.msi" -DestinationPath "$art/Spektra-$ver-Setup.zip" -Force

          foreach ($rid in 'win-x64','linux-x64','osx-x64','osx-arm64') {
            $s = "dist/stage-cli-$rid"
            New-Item -ItemType Directory -Force $s | Out-Null
            Copy-Item (Get-ChildItem "dist/cli-$rid/spektra*") $s
            Copy-Item LICENSE.md $s
            Compress-Archive -Path "$s/*" -DestinationPath "$art/spektra-cli-$ver-$rid.zip" -Force
          }
          Get-ChildItem $art

      - name: Compute checksums
        shell: pwsh
        run: |
          $art = 'dist/artifacts'
          $lines = Get-ChildItem $art -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          $lines | Set-Content "$art/SHA256SUMS.txt" -Encoding ascii
          Write-Host ($lines -join "`n")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spektra-${{ steps.v.outputs.version }}
          path: dist/artifacts/*

      - name: Release summary from tag body
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # Optional per-release summary. The annotated tag's body (everything
          # after the first line) becomes the top of the release notes, above
          # the auto-generated commit list. The "Spektra X.Y.Z" subject is left
          # out (it duplicates the release title) and so is the tag's PGP
          # signature. A tag with no body yields no summary.
          $body = (git tag -l --format='%(contents:body)' $env:GITHUB_REF_NAME) -join "`n"
          Set-Content notes.md -Value $body.Trim() -Encoding utf8
          if ($body.Trim()) { Write-Host "Release summary:`n$($body.Trim())" }
          else { Write-Host "No tag body; using generated notes only." }

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        # Pinned to the commit behind v3: this third-party action runs with
        # the workflow's contents:write token and uploads the artifacts (and
        # SHA256SUMS.txt) users verify against, so a retagged v3 upstream must
        # not be able to change what executes here. Dependabot bumps the pin.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Spektra ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/artifacts/*.zip
            dist/artifacts/*.msi
            dist/artifacts/SHA256SUMS.txt
          generate_release_notes: true

      # npm comes after the GitHub release on purpose: the release page is the
      # shop window and nothing about a second distribution channel should be
      # able to stop it appearing. Assembling runs on manual builds too, so
      # its checks (every runtime identifier present, none of them stale, and
      # the win-x64 binary actually reporting the version being stamped) are
      # exercised without a tag.
      - name: Assemble npm packages
        run: node packaging/npm/build.mjs --version ${{ steps.v.outputs.version }}

      # Trusted publishing. npm exchanges this job's OIDC token for a
      # short-lived credential and attaches provenance by itself, so there is
      # no token to store, no NODE_AUTH_TOKEN, no .npmrc to write, and no
      # --provenance flag to pass. It requires each of the five packages to
      # name this repository and this workflow file as its trusted publisher
      # on npmjs.com; until that is configured npm answers 403 and this step
      # fails, with the GitHub release already complete. See
      # packaging/npm/PUBLISHING.md.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: node packaging/npm/publish.mjs

      # A manual build packs the same tarballs and reports the integrity each
      # one would be published under, without touching the registry, so the
      # packaging can be inspected before any tag exists.
      - name: Pack npm packages (dry run)
        if: github.ref_type != 'tag'
        run: node packaging/npm/publish.mjs --dry-run

      # Kept from a tag run too, and kept even when the publish above failed,
      # which is the case that needs them. publish.mjs packs every tarball
      # before it publishes any of them, so these are the exact bytes it sent
      # or would have sent. Without them a partial publish cannot be finished:
      # a re-run rebuilds the binaries, .NET single-file output is not
      # byte-reproducible, and publish.mjs then correctly refuses to republish
      # the packages that did land, so the whole release needs a new version
      # number. With them, the missing ones can be published by hand.
      - name: Upload npm packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spektra-npm-${{ steps.v.outputs.version }}
          if-no-files-found: ignore
          path: |
            dist/npm/*.tgz
            dist/npm/INTEGRITY.txt

  # Installs what was just published on one runner per platform and runs it.
  # Everything above happens on Windows, so this is the only check that sees
  # the Linux and macOS binaries actually execute. Tags only, because only a
  # tag publishes.
  smoke:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/npm-smoke.yml
    with:
      version: ${{ needs.release.outputs.version }}
