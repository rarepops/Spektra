name: ci

# Build and test on every push/PR to main or dev. Tests decode small audio
# fixtures, so ffmpeg is installed on the runner.

# This workflow only reads the repo; saying so stops the token from riding
# whatever the repository's default permissions happen to be.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format Spektra.slnx --verify-no-changes

      # The npm package's dispatcher decides which prebuilt binary a machine
      # needs, and nothing else in the build compiles or runs it. Node's own
      # test runner covers that decision, and --check parses the two release
      # scripts, which otherwise only ever run while a tag is being published.
      # Windows runners ship Node, so there is nothing to install. bash rather
      # than pwsh: pwsh does not stop a multi-line run when a native command
      # exits non-zero, so a failure here would pass silently.
      - name: Test npm dispatcher
        shell: bash
        run: |
          node --check packaging/npm/build.mjs
          node --check packaging/npm/publish.mjs
          node --test packaging/npm/test/shim.test.cjs

      # ffmpeg comes from the repo's own pinned fetcher rather than a package
      # feed. On 2026-08-21 community.chocolatey.org answered package queries
      # with 503, `choco install` exited 0 having installed 0/0 packages, and
      # this step passed anyway; the suite then failed 70 tests at once with
      # NullReferenceException deep inside FolderAudit, because the fixtures
      # write `FfmpegLocator.Locate([])!` and the `!` only silences the
      # compiler. Pinning also means CI decodes with the exact build the in-app
      # downloader ships, instead of whatever version a feed carries today.
      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Spektra/ffmpeg
          # Re-pinning edits that script, which retires the cache entry.
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tools/get-ffmpeg.ps1') }}

      - name: Install ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/get-ffmpeg.ps1

      - name: Put ffmpeg on PATH
        shell: pwsh
        run: |
          # Fail here, with the reason, rather than let a missing binary reach
          # the suite and be reported as dozens of null references.
          $dir = "$env:LOCALAPPDATA\Spektra\ffmpeg"
          foreach ($exe in 'ffmpeg.exe', 'ffprobe.exe') {
            if (-not (Test-Path "$dir\$exe")) {
              throw "$exe is missing from $dir, so the tests would decode nothing."
            }
          }
          "$dir" >> $env:GITHUB_PATH
          $banner = & "$dir\ffprobe.exe" -version
          Write-Host $banner[0]

      - name: Build
        run: dotnet build Spektra.slnx -c Release --nologo

      - name: Test
        run: dotnet test --project tests/Spektra.Tests -c Release
